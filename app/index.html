 const lines=()=>{ls.innerHTML=cart.map((x,i)=>{const I=(f,l,v)=>`<label>${l}<input type=number inputmode=decimal data-i=${i} data-f=${f} value="${v}"></label>`;
  return `<div class="ln lq"><div class=lh data-t=${i}><div><b>${esc(x.n)}</b><br><small class=mut id=sm${i}>${rsm(x)}</small></div><div class=lc><span class=chev>${x.open?'▲':'▼'}</span><button class=xb data-d=${i} aria-label=Quitar>✕</button></div></div><small class=err id=al${i}>${alr(x)}</small>
  ${x.open?`<div class=lb>${x.k?`<select data-i=${i} data-f=m><option value=x ${x.m==='x'?'selected':''}>Mixto: packs + sueltas</option><option value=u ${x.m==='u'?'selected':''}>Solo unidades</option><option value=p ${x.m==='p'?'selected':''}>Solo packs</option></select>`:''}<div class=grid>${I('c',x.m==='p'?'Packs':'Unidades',x.c)}${x.m==='u'||!x.k?I('pu','Precio unidad',x.pu):I('pp','Precio pack',x.pp)}</div>${x.m==='x'?`<div class=grid>${I('pu','Precio unidad suelta',x.pu)}<small class=mut id=bd${i}>${bd(x)}</small></div>`:''}</div>`:''}</div>`}).join('');tot()};
 ls.oninput=e=>{const i=e.target.dataset.i;if(i!=null&&e.target.tagName!=='SELECT'){cart[i][e.target.dataset.f]=parseFloat(e.target.value)||0;tot();const b=document.getElementById('bd'+i);if(b)b.textContent=bd(cart[i]);const a=document.getElementById('al'+i);if(a)a.textContent=alr(cart[i]);const sm=document.getElementById('sm'+i);if(sm)sm.textContent=rsm(cart[i])}};
 ls.onchange=e=>{if(e.target.tagName==='SELECT'){cart[e.target.dataset.i].m=e.target.value;lines()}};
 ls.onclick=e=>{const d=e.target.dataset.d;if(d!=null){cart.splice(d,1);lines();return}const t=e.target.closest('[data-t]');if(t){cart[t.dataset.t].open=!cart[t.dataset.t].open;lines()}};
 q.oninput=()=>{const t=norm(q.value);res.innerHTML=t?p.filter(x=>norm(x.nombre+' '+x.codigo).includes(t)).slice(0,8).map(x=>`<div class=row data-a=${x.id} style="cursor:pointer"><div><b>${esc(x.nombre)}</b>${x.descripcion?'<br><small class=mut>'+esc(x.descripcion)+'</small>':''}<br><small>${money(x.precio_unitario)} c/u${x.unidad==='Pack'&&x.precio_pack>0?' · '+money(x.precio_pack)+' x pack de '+x.cantidad_pack:''} · ${x.stock<=0?'⚠ sin stock':'stock '+x.stock}</small></div><b>＋</b></div>`).join(''):''};
 res.onclick=e=>{const r=e.target.closest('[data-a]');if(!r)return;const x=p.find(y=>y.id==r.dataset.a),ex=cart.find(y=>y.id===x.id);cart.forEach(y=>y.open=false);if(ex){ex.c+=1;ex.open=true}else{const k=x.unidad==='Pack'&&x.cantidad_pack>1&&x.precio_pack>0;cart.push({id:x.id,n:x.nombre,k,cp:x.cantidad_pack,pp:x.precio_pack,pu:x.precio_unitario,m:k?'x':'u',c:k?x.cantidad_pack:1,open:true})}q.value='';res.innerHTML='';lines()};
 dv.oninput=dt.onchange=tot;lines();
 document.getElementById('ok').onclick=async()=>{m.className='err';if(!cl.value)return m.textContent='Elegí un cliente';if(!cart.length||cart.some(x=>!(x.c>0)))return m.textContent='Agregá productos con cantidad válida';
  const bad=cart.filter(x=>need(x)>stk(x));if(bad.length&&!confirm('Stock insuficiente en:\n'+bad.map(x=>'• '+x.n+' (hay '+stk(x)+', pedís '+need(x)+')').join('\n')+'\n\n¿Guardar el pedido igual?'))return;
  const clid=cl.value,D=dsc(cart.reduce((a,x)=>a+sub(x),0));ok.disabled=true;m.textContent='Guardando…';
  const{data:pd,error:e1}=await sb.from('pedidos').insert({cliente_id:+clid,medio_pago:mp.value,estado:es.value,canal:'reparto',fecha:hoy(),descuento:D.amt,descuento_pct:D.pct}).select('id').single();
  if(e1){ok.disabled=false;return m.textContent=e1.message}
  const rows=cart.flatMap(x=>{const b={pedido_id:pd.id,producto_id:x.id};if(!x.k||x.m==='u')return[{...b,cantidad:x.c,precio_unitario:x.pu}];
   if(x.m==='p')return[{...b,cantidad:x.c*x.cp,precio_unitario:x.pp/x.cp}];
   const k=Math.floor(x.c/x.cp),r=x.c-k*x.cp,o=[];if(k>0)o.push({...b,cantidad:k*x.cp,precio_unitario:x.pp/x.cp});if(r>0)o.push({...b,cantidad:r,precio_unitario:x.pu});return o});
  const{error:e2}=await sb.from('pedido_items').insert(rows);
  if(e2){await sb.from('pedidos').delete().eq('id',pd.id);ok.disabled=false;return m.textContent='No se guardó: '+e2.message}
  cart=[];P=null;m.className='';m.innerHTML=`✔ Pedido #${pd.id} guardado. <a href="#/cliente/${clid}">Ver cliente</a><button class="btn s" id=wf>Enviar PDF</button><button class="btn s" id=wp>Enviar texto por WhatsApp</button>`;lines();ok.disabled=false;
  wf.onclick=()=>pdfPedido(pd.id);wp.onclick=async()=>{const{data:c}=await sb.from('clientes').select('telefono').eq('id',clid).single();waPedido(pd.id,c?.telefono)}}}
boot();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
